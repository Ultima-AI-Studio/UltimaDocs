<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family:"HarmonyOS Sans";
    src:url("file:///H:/UltimaAI/_shared/brand/fonts/HarmonyOS_Sans.ttf") format("truetype");
    font-weight:700;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#E8EDF6;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .artboard{
    width:2560px;height:1600px;zoom:0.5;flex:0 0 auto;
    background:radial-gradient(120% 200% at 20% 0%, #FFFFFF 0%, #F1F5FB 55%, #E4EBF5 100%);
    display:flex;align-items:center;justify-content:center;gap:17px;
    font-family:"HarmonyOS Sans",sans-serif;
  }
  .logo{height:108px;width:108px;flex:0 0 auto;}
  .logo img{width:100%;height:100%;display:block;}
  .main{
    font-size:48px;font-weight:700;letter-spacing:.5px;color:#0B1220;line-height:1;
  }
  .main span{color:#1D6FFF;}
</style>
</head>
<body>
  <div class="artboard">
    <div class="logo"><img src="../../ultima-logo/helmet.png"></div>
    <div class="main">Ultima<span>Console</span></div>
  </div>
</body>
</html>
