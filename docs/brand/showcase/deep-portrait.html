<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family:"HarmonyOS Sans";
    src:url("file:///H:/UltimaAI/_shared/brand/fonts/HarmonyOS_Sans.ttf") format("truetype");
    font-weight:700;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0A0E16;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .artboard{
    width:1600px;height:2560px;zoom:0.5;flex:0 0 auto;
    background:radial-gradient(120% 160% at 50% 0%, #101A30 0%, #0A0F1E 55%, #070B14 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:23px;
    font-family:"HarmonyOS Sans",sans-serif;
  }
  .logo{height:192px;width:192px;flex:0 0 auto;}
  .logo img{width:100%;height:100%;display:block;}
  .main{
    font-size:48px;font-weight:700;letter-spacing:.5px;color:#EAF2FF;line-height:1;
  }
  .main span{color:#4D9FFF;}
</style>
</head>
<body>
  <div class="artboard">
    <div class="logo"><img src="../../ultima-logo/helmet.png"></div>
    <div class="main">Ultima<span>Console</span></div>
  </div>
</body>
</html>
